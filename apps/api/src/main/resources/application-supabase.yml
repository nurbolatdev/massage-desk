# Profile for Supabase-hosted databases (dev and prod projects).
# Adds Supabase-only migrations: auth foreign keys, row level security, realtime.
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
  flyway:
    locations: classpath:db/migration,classpath:db/migration-supabase
  docker:
    compose:
      enabled: false
