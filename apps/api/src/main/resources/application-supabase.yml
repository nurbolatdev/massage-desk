# Profile for Supabase-hosted databases (dev and prod projects).
# Supabase-only migrations (db/migration-supabase) are added in application.yml.
# Connection settings are read from apps/api/.env (run the API from apps/api).
spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
  docker:
    compose:
      enabled: false
