spring:
  application:
    name: massage-desk-api
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration
  docker:
    compose:
      lifecycle-management: start-only

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
      path-mapping:
        health: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  whatsapp:
    verify-token: ${WHATSAPP_VERIFY_TOKEN:}
